name: Desplegar consulta-runt

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/consulta-runt/**'

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PLACAPI_KEY: ${{ secrets.PLACAPI_KEY }}
      PROJECT_REF: lxscdgzzfrpuahfrqndo
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Guardar clave de PlacApi en Supabase
        run: supabase secrets set PLACAPI_KEY="$PLACAPI_KEY" --project-ref "$PROJECT_REF"
      - name: Desplegar función
        run: supabase functions deploy consulta-runt --no-verify-jwt --project-ref "$PROJECT_REF"
